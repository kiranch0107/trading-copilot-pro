# Trading Copilot — scheduled exit monitor
# ────────────────────────────────────────────────────────────────────────
# Save this to  .github/workflows/exit-monitor.yml  in your repo.
#
# Runs exit_monitor.py every 30 minutes during US market hours and Telegrams
# you when an open position hits its stop or target. Runs on GitHub's
# infrastructure, so it works whether or not your Streamlit app or laptop is on
# — which is the entire point (a Streamlit app only executes while a tab is open).
#
# ── ONE-TIME SETUP ──────────────────────────────────────────────────────
# 1. Repo → Settings → Secrets and variables → Actions → New repository secret
#       TELEGRAM_BOT_TOKEN   (same bot the app uses)
#       TELEGRAM_CHAT_ID
# 2. Write access is now declared in the `permissions:` block below, so no
#    repo-level setting change is required. (If your org enforces read-only
#    tokens, that policy overrides the block and you must relax it there.)
# 3. Commit open_positions.json to the repo (the app writes it; even `[]` is fine).
#
# ── TESTING ─────────────────────────────────────────────────────────────
# Actions tab → "Exit Monitor" → Run workflow. Set dry_run=true for a safe
# no-send test that prints what it *would* have sent.
#
# ── COST ────────────────────────────────────────────────────────────────
# Public repos: free. Private: counts against your Actions minutes — roughly
# 14 runs/day × ~1 min. Keep the repo private only if you're comfortable with
# that, and note the schedule already skips nights and weekends.

name: Exit Monitor

on:
  schedule:
    # Every 30 min, 13:30–20:00 UTC, Mon–Fri.
    # NOTE: this is UTC and does NOT follow US daylight saving. It covers
    # 9:30am–4:00pm ET during EDT (Mar–Nov). During EST (Nov–Mar) US markets
    # run 14:30–21:00 UTC, so shift the hours below by one in winter, or just
    # widen the range — the script itself checks real market hours and exits
    # quietly when closed, so extra runs are harmless.
    - cron: "0,30 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending"
        type: boolean
        default: false
      force:
        description: "Run even if the market is closed"
        type: boolean
        default: false

concurrency:
  # Never let two runs mutate open_positions.json at once.
  group: exit-monitor
  cancel-in-progress: false

permissions:
  # Declared explicitly so the push works regardless of the repo-level
  # "Workflow permissions" setting. Relying on that setting was the likely
  # cause of "Could not push position state after 3 attempts": the default
  # GITHUB_TOKEN is read-only, and a read-only token fails the push silently
  # at the end, after alerts have already gone out.
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone (the default, depth 1) has no history to rebase
          # onto, so `git pull --rebase` fails outright. Full history is a
          # couple of seconds for a repo this size.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas pytz requests

      - name: Run exit monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python exit_monitor.py \
            --interval 30 \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Persist position state
        # Without this the "already alerted" flag is lost between runs and you
        # get the same exit alert every 30 minutes until you close the trade.
        #
        # The Streamlit app ALSO writes this file (via the GitHub Contents API)
        # whenever you log or close a position. If it committed between our
        # checkout and our push, a plain push is rejected. --rebase replays our
        # state change on top of yours instead of discarding either.
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain open_positions.json)" ]]; then
            git config user.name  "exit-monitor"
            git config user.email "actions@github.com"
            git add open_positions.json
            git commit -m "chore: update position state [skip ci]"
            BRANCH="${GITHUB_REF_NAME:-main}"
            for attempt in 1 2 3; do
              # Explicit refspec: actions/checkout can leave HEAD detached, in
              # which case a bare `git push` has no upstream and aborts.
              if git pull --rebase --autostash origin "$BRANCH" \
                 && git push origin "HEAD:$BRANCH"; then
                echo "State pushed on attempt $attempt."
                exit 0
              fi
              echo "Push attempt $attempt failed — retrying in 5s."
              git status --short || true
              sleep 5
            done
            echo "::warning::Could not push position state after 3 attempts. \
            Any alerts that fired were still delivered, but last_check_epoch and \
            the already-alerted flag were NOT saved — so that timestamp will look \
            frozen and you may get one duplicate alert next run. Check that the \
            job has contents:write permission."
            exit 1
          else
            echo "No state change to commit."
          fi
