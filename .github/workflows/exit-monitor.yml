# Trading Copilot — scheduled exit monitor
# ────────────────────────────────────────────────────────────────────────
# Save this to  .github/workflows/exit-monitor.yml  in your repo.
#
# Runs exit_monitor.py every 30 minutes during US market hours and Telegrams
# you when an open position hits its stop or target. Runs on GitHub's
# infrastructure, so it works whether or not your Streamlit app or laptop is on
# — which is the entire point (a Streamlit app only executes while a tab is open).
#
# ── ONE-TIME SETUP ──────────────────────────────────────────────────────
# 1. Repo → Settings → Secrets and variables → Actions → New repository secret
#       TELEGRAM_BOT_TOKEN   (same bot the app uses)
#       TELEGRAM_CHAT_ID
#       TIINGO_API_KEY       (optional — see data_source.py; unset means
#                             Yahoo-only, exactly today's behaviour)
# 2. Write access is now declared in the `permissions:` block below, so no
#    repo-level setting change is required. (If your org enforces read-only
#    tokens, that policy overrides the block and you must relax it there.)
# 3. Commit open_positions.json to the repo (the app writes it; even `[]` is fine).
#
# ── TESTING ─────────────────────────────────────────────────────────────
# Actions tab → "Exit Monitor" → Run workflow. Set dry_run=true for a safe
# no-send test that prints what it *would* have sent.
#
# ── COST ────────────────────────────────────────────────────────────────
# Public repos: free. Private: counts against your Actions minutes — roughly
# 14 runs/day × ~1 min. Keep the repo private only if you're comfortable with
# that, and note the schedule already skips nights and weekends.

name: Exit Monitor

on:
  schedule:
    # Every 30 min, 13:00-21:59 UTC, Mon-Fri.
    #
    # Cron is UTC and does not follow US daylight saving, so a fixed window
    # cannot fit both. 13-20 covered EDT only: through the EST half of the
    # year (Nov-Mar) the session runs 14:30-21:00 UTC, and the 15:00-16:00 ET
    # hour — the close, when stops and targets most often get hit — had NO
    # monitor run at all. scanner.yml already uses 13-21; this one did not.
    #
    # Widened rather than "shift it in winter", because that is a manual step
    # nobody remembers twice a year. The script re-checks real ET market
    # hours and exits quietly when closed, so the extra runs cost seconds.
    # Hourly, 14:00-20:00 UTC. Halved from every 30 min for the same
    # scheduling-reliability reason as scanner.yml, but NOT cut as far: unlike
    # the scanner, this one reads LIVE option quotes, so its input genuinely
    # changes between runs and a missed window can mean a stop or target that
    # is hit and not alerted. Hourly is the compromise between responsiveness
    # and not being deprioritised by GitHub.
    #
    # WIDENED 2026-09-09, after a position lost 72% against a 50% stop rule.
    #
    # The previous window (15-19 UTC) was chosen as the hours inside RTH in
    # both EST and EDT. That is true and it was the wrong optimisation: it
    # bought "every run is during market hours" at the cost of covering only
    # 11:00-15:00 ET. The open (9:30-11:00) and the close (15:00-16:00) — the
    # two windows where stops and targets are most often hit — had no run at
    # all, all year.
    #
    # What it cost: a paper AAPL call opened 09-03 was last checked Fri 09-04
    # at 15:00 EDT. Monday 09-07 was Labor Day. The next run was Tue 09-08 at
    # 11:00 EDT — a 92-hour gap across a weekend and a holiday. It exited at
    # -71.7% against a -50% rule.
    #
    # 13-21 UTC covers 9:00am-5:00pm EDT and 8:00am-4:00pm EST, so the whole
    # session is inside the window in both halves of the year. The script
    # re-checks real ET market hours and exits in seconds when closed, so the
    # out-of-hours runs cost almost nothing — the same trade scanner.yml
    # already makes.
    #
    # This does NOT make the stop a stop. Nine polls a day cannot act on an
    # overnight gap, a weekend, or a holiday, and on a long option the premium
    # is the entire risk. It is an alert, and the app now says so.
    - cron: "0 13,14,15,16,17,18,19,20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of sending"
        type: boolean
        default: false
      force:
        description: "Run even if the market is closed"
        type: boolean
        default: false

concurrency:
  # Never let two runs mutate open_positions.json at once.
  group: exit-monitor
  cancel-in-progress: false

permissions:
  # Declared explicitly so the push works regardless of the repo-level
  # "Workflow permissions" setting. Relying on that setting was the likely
  # cause of "Could not push position state after 3 attempts": the default
  # GITHUB_TOKEN is read-only, and a read-only token fails the push silently
  # at the end, after alerts have already gone out.
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone (the default, depth 1) has no history to rebase
          # onto, so `git pull --rebase` fails outright. Full history is a
          # couple of seconds for a repo this size.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas pytz requests

      - name: Run exit monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional — data_source.py's fallback provider (see its docstring)
          # activates only when this is set. Unset means Yahoo-only, exactly
          # the pre-fallback behaviour. Set the SAME secret in Streamlit
          # Cloud so the app and the monitor degrade the same way.
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          # Explicit rather than relying on universe.DEFAULT_DYNAMIC. That
          # default is buried in code, and app.py (Streamlit Cloud) reads the
          # same toggle from a different environment — a silent default is how
          # the two end up scanning different universes and you get alerts for
          # tickers the app will not show. Set the SAME value in Streamlit
          # Cloud secrets.
          USE_DYNAMIC_UNIVERSE: '1'
        run: |
          python exit_monitor.py \
            --interval 30 \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Persist position state
        # Without this the "already alerted" flag is lost between runs and you
        # get the same exit alert every 30 minutes until you close the trade.
        #
        # The Streamlit app ALSO writes this file (via the GitHub Contents API)
        # whenever you log or close a position. If it committed between our
        # checkout and our push, a plain push is rejected. --rebase replays our
        # state change on top of yours instead of discarding either.
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain open_positions.json)" ]]; then
            git config user.name  "exit-monitor"
            git config user.email "actions@github.com"
            git add open_positions.json
            git commit -m "chore: update position state [skip ci]"
            BRANCH="${GITHUB_REF_NAME:-main}"
            for attempt in 1 2 3; do
              # Explicit refspec: actions/checkout can leave HEAD detached, in
              # which case a bare `git push` has no upstream and aborts.
              if git pull --rebase --autostash origin "$BRANCH" \
                 && git push origin "HEAD:$BRANCH"; then
                echo "State pushed on attempt $attempt."
                exit 0
              fi
              echo "Push attempt $attempt failed — retrying in 5s."
              git status --short || true
              sleep 5
            done
            echo "::warning::Could not push position state after 3 attempts. \
            Any alerts that fired were still delivered, but last_check_epoch and \
            the already-alerted flag were NOT saved — so that timestamp will look \
            frozen and you may get one duplicate alert next run. Check that the \
            job has contents:write permission."
            exit 1
          else
            echo "No state change to commit."
          fi
