# Module self-tests — no network, no market-data budget
# ─────────────────────────────────────────────────────────────────────────
# Every module that decides what "a signal" means (signal_core.py) or that
# validates the signal (backtest.py, oos_validate.py, data_reservation.py)
# or builds the universe it runs on (universe.py) already ships a --selftest
# that runs entirely on synthetic/injected data — no Yahoo call, no rate
# limit, no market hours to wait for. None of it was wired into CI, so a
# change to shared logic could break silently until a live alert misbehaved.
#
# This just runs what was already written. Every job here should finish in
# seconds; if one is slow or needs network, that is itself a bug to fix in
# the module, not in this workflow.

name: Module self-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # signal_core.py has no --selftest flag — running the module IS the
      # test (see its `if __name__ == "__main__": sys.exit(selftest())`).
      - name: signal_core.py — the one signal implementation every caller shares
        run: python signal_core.py

      - name: data_source.py — Yahoo / fallback provider routing
        run: python data_source.py

      - name: market_context.py — weekly trend + SPY regime decision rules
        run: python market_context.py

      - name: universe.py — universe selection, sector cap, snapshot loader
        run: python universe.py --selftest

      - name: bar_cache.py — reproducible bars (hash, tamper, fidelity)
        run: python bar_cache.py --selftest

      - name: backtest.py — signal_core-backed trade simulation
        run: python backtest.py --selftest

      - name: oos_validate.py — OOS harness parser + significance stats
        run: python oos_validate.py --selftest

      - name: data_reservation.py — held-out data reservation ledger
        run: python data_reservation.py --selftest

      - name: excursion_analysis.py — MAE/MFE math
        run: python excursion_analysis.py --selftest

      - name: churn_tracker.py — universe snapshot/diff/turnover
        run: python churn_tracker.py --selftest

      # ── The half CI used to miss ──────────────────────────────────────
      # Everything above is an offline research module. The modules that
      # actually run unattended and send money-affecting alerts — scanner.py,
      # exit_monitor.py, option_chain.py, journal_store.py, gh_sync.py — had
      # NO coverage at all, which is how universe_backtest.py and
      # option_backtest.py sat broken (AttributeError on every run) after
      # backtest.evaluate_signal()'s signature changed under them.
      #
      # PARTLY CLOSED, 2026-09-10. The list above read as a problem already
      # solved when only scanner.py, journal_store.py and gh_sync.py had gained
      # tests. exit_monitor.py now has one too, and it runs below — it closes
      # LIVE positions on an hourly schedule, so it was the worst gap. Two
      # remain with no selftest at all: option_chain.py (picks the contract) and
      # option_backtest.py (produces OPT_WIN_RATE).
      #
      # That is not cosmetic. exit_monitor.py decides when to close a LIVE
      # position and runs unattended on a schedule; option_chain.py picks which
      # contract to buy; option_backtest.py produces OPT_WIN_RATE, the input the
      # live option spread gate in risk_params.py is derived from. All three are
      # covered only by consistency_check.py's import check — which proves they
      # parse, not that they are right.
      #
      # Tracked as item 5 in BACKLOG.md. Writing those tests is real work and is
      # deliberately not stubbed here: a shallow test on live-money code that
      # passes regardless is worse than a visible gap, and this repo has already
      # found seven fixtures that did exactly that.

      - name: risk_params.py — account/risk constants
        run: python risk_params.py

      - name: notify.py — Telegram retry policy (offline)
        run: python notify.py

      - name: gh_sync.py — 409 retry + position merge (offline)
        run: python gh_sync.py

      - name: journal_store.py — paper/live split, dollar P&L (offline)
        run: python journal_store.py

      - name: scanner.py — outage detection + alert cooldown (offline)
        run: python scanner.py --selftest

      - name: exit_monitor.py — exit rules, offline (closes LIVE positions)
        run: python exit_monitor.py --selftest

      - name: option_backtest.py — coverage guard (produces OPT_WIN_RATE)
        run: python option_backtest.py --selftest

      - name: vrp_check.py — implied-vs-realised measurement + pre-registered bar
        run: python vrp_check.py --selftest

      - name: spread_backtest.py — defined-risk spread engine + pre-registered bar
        run: python spread_backtest.py --selftest

      - name: power_check.py — can a planned test detect what it looks for
        run: python power_check.py --selftest

      - name: adx_retest.py — Holm correction, dose-response, sample floor
        run: python adx_retest.py --selftest

      - name: consistency_check.py — invariants that span modules
        run: python consistency_check.py

      # app.py is a Streamlit script: importing it renders the UI and makes
      # live Yahoo calls, so CI compiles it and lints it instead of running it.
      - name: app.py — compiles and has no undefined names
        run: |
          python -m py_compile app.py
          pip install pyflakes
          python -m pyflakes app.py \
            | grep -v "f-string is missing placeholders" \
            | tee /tmp/pyflakes.out
          test ! -s /tmp/pyflakes.out
