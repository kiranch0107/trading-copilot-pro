# Trading Scanner — scheduled watchlist scan
# ─────────────────────────────────────────────────────────────────────────
# Save to  .github/workflows/trading-scanner.yml
#
# WHAT CHANGED AND WHY
#
# The old schedule was:  '*/30 * * * *'
# That is every 30 minutes, 24 hours a day, 7 days a week — about 336 runs a
# week. The overwhelming majority fired overnight and at weekends, when no
# price data can possibly have changed. It also spent Yahoo Finance rate limit
# around the clock, which is the same budget the Options tab needs.
#
# Two fixes below:
#   1. The cron now only covers weekday US market hours.
#   2. A guard step checks the REAL market calendar before doing any work.
#      GitHub cron is UTC-only and does not follow US daylight saving, so a
#      hardcoded window is wrong for half the year. The cron is therefore
#      deliberately a little wide (covers both EST and EDT) and the guard
#      trims it precisely — including market holidays and half-days.
#
# WORTH CONSIDERING: is intraday scanning useful at all?
#   The scanner analyses DAILY bars, and drop_partial_bar() discards today's
#   in-progress bar while the market is open. So during the session it is
#   always analysing yesterday's completed bar — which does not change. EMA,
#   MACD, RSI, ADX and every level are identical at 9:35am and 3:55pm.
#   The signal changes exactly once a day, at the close.
#
#   If you only care about the signal, use the once-daily cron below instead
#   (5 runs/week instead of ~90). Keep the intraday schedule only if you also
#   want fresh OPTIONS data, which does change through the session.

name: Trading Scanner

on:
  schedule:
    # Every ~2h, 15:07-19:07 UTC, Mon-Fri. Three slots per day, down from 18.
    #
    # WHY THE CUT: scanner.py fetches interval="1d" and calls
    # drop_partial_bar(), so it always evaluates the last COMPLETED daily bar.
    # That bar does not change during the session — the 9:37am scan and the
    # 3:37pm scan computed identical indicators and reached identical
    # conclusions. Eighteen slots a day bought exactly one answer.
    #
    # AND IT COST RELIABILITY: GitHub schedules are best-effort and repos with
    # heavy cron load get dropped first. Run #538 (2026-08-28) was delayed
    # roughly six hours and executed at 02:47 UTC, long after the close, so
    # the market-hours guard skipped it and the run did nothing in 7 seconds.
    # Fewer slots means each is likelier to be serviced on time.
    #
    # ONLY UTC hours 15-19 are inside 9:30am-4:00pm ET in BOTH EST and EDT.
    # Outside that band a fixed UTC cron is wrong half the year: 14:07 UTC is
    # 9:07am ET in winter (pre-open) and 20:07 UTC is 4:07pm ET in summer
    # (post-close). The old 13-21 range therefore wasted several slots a day
    # on runs the guard was always going to skip.
    #   15:07 UTC = 11:07am EDT / 10:07am EST
    #   17:07 UTC =  1:07pm EDT / 12:07pm EST
    #   19:07 UTC =  3:07pm EDT /  2:07pm EST
    # TWO slots an hour, every session hour, not three a day. GitHub's
    # scheduler delivered the 15:07 UTC slot ZERO times between 09-16 and
    # 10-07 and the other two 2-4 h late; 11 of 48 scheduled runs scanned.
    # More slots are more chances. The market-hours guard discards the late
    # ones and `concurrency` serialises any that collide, so redundancy here
    # costs nothing but a few seconds of skipped runs.
    #
    # THIS IS THE BACKUP. The primary trigger is external -- see
    # "RELIABLE SCHEDULING" below. `schedule` on its own is not reliable and
    # has not been since 2026-08-26.
    - cron: '7,37 15,16,17,18,19 * * 1-5'

    # POST-CLOSE RECORD-ONLY PASS (backup slots; the primary is job 4 below).
    # 20:20 UTC is 16:20 EDT (in the window) / 15:20 EST (pre-close, the
    # guard skips it); 21:20 UTC is 17:20 EDT / 16:20 EST. One of the two is
    # inside the 16:00-18:00 ET window all year. The step that runs here is
    # `scanner.py --record-only`: forward-log rows and the scan heartbeat for
    # TODAY's settled bar, no trade alert, no chain fetch. See
    # "Record the closed bar" below.
    - cron: '20 20,21 * * 1-5'

    # DO NOT use a post-close cron such as '15 20 * * 1-5' (4:15pm ET). The
    # guard step requires 9:30-16:00 ET, so a 16:15 run is skipped as
    # market-closed and never scans. A previous comment here recommended
    # exactly that; it would have run daily and produced nothing.

  # ── RELIABLE SCHEDULING — the external trigger (BACKLOG 22) ─────────────
  #
  # GitHub's `schedule` has delivered this workflow in session on 23% of its
  # slots since 2026-08-26 (community discussions #207346, #206019), with
  # every skipped run reporting `success`. `workflow_dispatch` is unaffected:
  # a dispatch on 2026-10-07 was created and started in the same second.
  #
  # So the PRIMARY trigger is an external HTTP cron calling this endpoint:
  #
  #   POST https://api.github.com/repos/kiranch0107/trading-copilot-pro/actions/workflows/scanner.yml/dispatches
  #   Authorization: Bearer <fine-grained PAT>
  #   Accept: application/vnd.github+json
  #   Body: {"ref":"main"}
  #
  # ONE-TIME SETUP (owner):
  #   1. GitHub -> Settings -> Developer settings -> Fine-grained tokens.
  #      Repository access: ONLY this repo. Permission: Actions -> Read and
  #      write. Nothing else. The token lives in the cron service, never here.
  #   2. On any HTTP cron service that can set headers (cron-job.org is the
  #      usual free one), create three jobs with the request above at
  #      11:07, 13:07, 15:07 in timezone America/New_York, Mon-Fri. Setting
  #      the timezone there ends the UTC/DST problem every comment in this
  #      file has fought.
  #   3. Do the same for exit-monitor.yml, hourly 09:30-16:00 ET.
  #   4. A FOURTH job for this workflow at 16:20 America/New_York, Mon-Fri.
  #      The guard step sees it is after the close and runs the record-only
  #      pass instead of the alerting scan (added 2026-10-08).
  #   5. Keep the `schedule` block above as the backup.
  #
  # Dispatch without `inputs` takes the defaults below (force=false), so the
  # market-hours guard still applies. `concurrency` makes a double-fire safe.
  workflow_dispatch:               # manual run, always allowed
    inputs:
      log_level:
        description: "Log level (DEBUG shows per-ticker reject reasons)"
        type: choice
        options: ["INFO", "DEBUG"]
        default: "INFO"
      force:
        description: 'Run even if the market is closed'
        type: boolean
        default: false

concurrency:
  # A delayed run must never overlap the next scheduled one.
  group: trading-scanner
  cancel-in-progress: false

permissions:
  # Needed so the alert-cooldown state can be committed back. Without it the
  # dedup file is lost between runs and every qualifying setup re-alerts on
  # each scan — the "13 identical messages a day" problem.
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      # CHECKOUT AND INSTALL ON EVERY RUN, INCLUDING THE ONES THAT CANNOT SCAN.
      #
      # The guard used to run before checkout "so a closed-market slot costs a
      # few seconds instead of a full install". That saved seconds and cost
      # three weeks: a late run skipped everything, reported success, and
      # nothing could tell the owner the scanner had gone quiet. The coverage
      # step below needs the repo (it reads the committed forward log and
      # position file) and runs on EVERY run, so the install is unconditional.
      # Public repo; the minutes are free.
      # Node 24 majors (checkout v5, setup-python v6). The v4 / v5 pins ran
      # on Node 20, which GitHub is retiring; every run warned about it.
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0     # full history so `git pull --rebase` works

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      # PINNED TO requirements.txt via a constraints file. This line used to
      # read `pip install yfinance pandas ta requests pytz` -- unpinned -- and
      # on 2026-10-02 it installed yfinance 1.7.0 / pandas 3.0.6 while the
      # selftests in tests.yml ran against the pinned 1.6.0 / 3.0.5. The live
      # money path was running versions CI had never seen. `-c` installs ONLY
      # the named packages, at requirements.txt's versions, so there is one
      # place pins live (BACKLOG 27).
      - name: Install dependencies
        run: pip install -c requirements.txt yfinance pandas ta requests pytz

      # ── Guard: is the US market actually open right now? ──
      - name: Check market hours
        id: market
        run: |
          python3 - <<'PY'
          import os, datetime, zoneinfo
          ET = zoneinfo.ZoneInfo("America/New_York")
          now = datetime.datetime.now(ET)

          # NYSE full closures and 1:00pm early closes (same list the app uses)
          HOLIDAYS = {
            "2025-01-01","2025-01-09","2025-01-20","2025-02-17","2025-04-18",
            "2025-05-26","2025-06-19","2025-07-04","2025-09-01","2025-11-27",
            "2025-12-25",
            "2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25",
            "2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25",
            "2027-01-01","2027-01-18","2027-02-15","2027-03-26","2027-05-31",
            "2027-06-18","2027-07-05","2027-09-06","2027-11-25","2027-12-24",
          }
          HALF_DAYS = {"2025-07-03","2025-11-28","2025-12-24",
                       "2026-11-27","2026-12-24",
                       "2027-11-26"}

          day = now.strftime("%Y-%m-%d")
          reason = ""
          postclose = False
          if now.weekday() >= 5:
              is_open, reason = False, "weekend"
          elif day in HOLIDAYS:
              is_open, reason = False, "market holiday"
          else:
              ch, cm = (13, 0) if day in HALF_DAYS else (16, 0)
              start = now.replace(hour=9, minute=30, second=0, microsecond=0)
              end   = now.replace(hour=ch, minute=cm, second=0, microsecond=0)
              is_open = start <= now <= end
              # The two hours after the close: today's bar is settled and the
              # market is shut, so the record-only pass runs instead of the
              # alerting scan. Mirrors scanner.is_post_close_window().
              postclose = end < now <= end + datetime.timedelta(hours=2)
              if not is_open:
                  reason = "outside 9:30-%02d:%02d ET" % (ch, cm)

          print(f"Now (ET): {now:%Y-%m-%d %H:%M %A}")
          print(f"Market open: {is_open}" + (f" ({reason})" if reason else ""))
          print(f"Post-close window: {postclose}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"open={'true' if is_open else 'false'}\n")
              fh.write(f"postclose={'true' if postclose else 'false'}\n")
          PY

      - name: Skip notice
        if: steps.market.outputs.open != 'true' && steps.market.outputs.postclose != 'true' && inputs.force != true
        run: echo "Market closed — scan skipped. The coverage check below still runs."

      - name: Run scanner
        if: steps.market.outputs.open == 'true' || inputs.force == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional — data_source.py's fallback provider (see its docstring)
          # activates only when this is set. Unset means Yahoo-only, exactly
          # the pre-fallback behaviour. Set the SAME secret in Streamlit
          # Cloud so the app and the scanner degrade the same way.
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          # Explicit rather than relying on universe.DEFAULT_DYNAMIC. That
          # default is buried in code, and app.py (Streamlit Cloud) reads the
          # same toggle from a different environment — a silent default is how
          # the two end up scanning different universes and you get alerts for
          # tickers the app will not show. Set the SAME value in Streamlit
          # Cloud secrets.
          USE_DYNAMIC_UNIVERSE: '1'
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
        run: python scanner.py

      # ── THE POST-CLOSE PASS — today's bar, into the record, the day it closed ──
      #
      # During the session every scan evaluates YESTERDAY's bar, so a signal
      # that forms at today's close is first written by tomorrow's 11:07 scan
      # — or later, if tomorrow's dispatches miss. In the two hours after the
      # close today's bar is settled. --record-only writes its signal rows and
      # the `scan` heartbeat and nothing else: no trade alert (the market is
      # shut; the next session's first scan alerts, because the cooldown does
      # not read the log) and no chain fetch. A forced dispatch takes the
      # alerting path above instead, as before.
      - name: Record the closed bar
        if: steps.market.outputs.postclose == 'true' && inputs.force != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # outage alert only
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          USE_DYNAMIC_UNIVERSE: '1'
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
        run: python scanner.py --record-only

      # ── THE ALARM FOR SILENCE — runs on EVERY run, scanned or not ──
      #
      # is_total_outage() fires when every ticker fails INSIDE a run. It cannot
      # see a run that never scans. This reads the committed forward log's last
      # `scan` row and the position file's last_check_epoch, and pages (once a
      # day) when no scan has evaluated a bar for 2 trading days or an open
      # position has gone a session unchecked. A late run that cannot scan can
      # still say the scanner has gone quiet -- which, from 10-02 to 10-07, it
      # had, with every run reporting success. No market data needed.
      - name: Check scan coverage
        if: always() && !inputs.dry_run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USE_DYNAMIC_UNIVERSE: '1'
        run: python scanner.py --coverage

      - name: Persist alert cooldown state and the forward log
        # TWO files, and the second was missing — which made the forward log
        # inert from the day it was added.
        #
        # scanner_state.json records when each ticker/direction last alerted.
        # It must survive between runs or dedup does nothing.
        #
        # forward_log.jsonl is the tamper-evident record of every signal. It is
        # written HERE, on an ephemeral runner, and was never committed — so
        # every row it ever wrote was destroyed with the container. The design
        # says so in .gitignore, in writing: "Git is the external anchor:
        # committing the log after each scan makes a truncation visible as a
        # deletion in the diff." That commit did not exist. A hash chain cannot
        # detect its own tail being cut, so without this step the log had no
        # protection AND no data.
        #
        # ORDER MATTERED HERE. Adding this step before record_signal() deduped
        # on the signal bar would have committed three rows per signal per day
        # (this workflow runs three times, and drop_partial_bar() means all
        # three read the same settled bar) into an APPEND-ONLY chain that cannot
        # be cleaned afterwards — only abandoned. The dedupe landed first.
        if: always()
        run: |
          if [[ -n "$(git status --porcelain scanner_state.json forward_log.jsonl)" ]]; then
            git config user.name  "trading-scanner"
            git config user.email "actions@github.com"
            git add scanner_state.json forward_log.jsonl
            git commit -m "chore: update scanner alert state + forward log [skip ci]"
            BRANCH="${GITHUB_REF_NAME:-main}"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "$BRANCH" \
                 && git push origin "HEAD:$BRANCH"; then
                echo "State pushed on attempt $attempt."
                exit 0
              fi
              echo "Push attempt $attempt failed — retrying in 5s."
              sleep 5
            done
            echo "::warning::Could not push scanner state. Dedup will not carry \
            over, so expect repeat alerts on the next run — and any forward-log \
            rows written this run are LOST, because the runner is ephemeral and \
            git is the log's only durable home."
          else
            echo "No state change to commit."
          fi
